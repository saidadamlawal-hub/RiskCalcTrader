workflows:
  android-build:
    name: Build RiskCalc Trader APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build with System Gradle
        script: |
          # If gradlew fails, use the gradle installed on the build machine
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
