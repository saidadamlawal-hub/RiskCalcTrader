workflows:
  android-build:
    name: RiskCalc Trader - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Ensure Android platform folder exists
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.riskcalctrader.app --project-name risk_calc_trader
          fi
      - name: Bump compileSdk/targetSdk to 36
        script: |
          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            perl -pi -e 's/compileSdkVersion\s*=\s*flutter\.compileSdkVersion/compileSdkVersion = 36/' "$GRADLE"
            perl -pi -e 's/targetSdkVersion\s*=\s*flutter\.targetSdkVersion/targetSdkVersion = 36/' "$GRADLE"
          fi
      - name: Set app display name to RiskCalc Trader
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            perl -pi -e 's/android:label="[^"]*"/android:label="RiskCalc Trader"/' "$MANIFEST"
          fi
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/**/*.apk
