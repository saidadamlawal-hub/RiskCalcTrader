workflows:
  android-build:
    name: Build RiskCalc Trader APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Install Gradle Wrapper (Safety Step)
        script: |
          curl -LO https://raw.githubusercontent.com/gradle/gradle/master/gradlew
          chmod +x gradlew
          mkdir -p gradle/wrapper
          curl -L https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.properties > gradle/wrapper/gradle-wrapper.properties
      - name: Build APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
